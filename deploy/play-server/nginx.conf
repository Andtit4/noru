# nginx in front of the rooms server (when the server already runs nginx on ports 80 / 443).
#
#   cp nginx.conf /etc/nginx/sites-available/noru-play   # replace ROOMS_HOST below first
#   ln -s /etc/nginx/sites-available/noru-play /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ROOMS_HOST                        # HTTPS: wss://ROOMS_HOST
server {
    listen 80;
    server_name ROOMS_HOST;

    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Players stay connected for a long time (the server pings them).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
