[workspace]
resolver = "2"
members = ["crates/*", "packages/noru"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Andtit4/noru"

[workspace.dependencies]
noru_core = { path = "crates/noru_core" }
oxc = { version = "0.158.0", features = ["semantic", "transformer", "codegen", "minifier", "ast_visit"] }
oxc_resolver = "11.24.3"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
rayon = "1.12.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
regex = "1.13.1"
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
flate2 = "1"
notify = "8"
clap = { version = "4.6.7", features = ["derive", "env"] }
napi = "3.16.1"
napi-derive = "3.7.0"
napi-build = "2.6.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
